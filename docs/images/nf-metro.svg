<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="subwayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="summaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b2226"/>
      <stop offset="100%" stop-color="#ae2012"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Arrowhead marker -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00b4d8"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e63946"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#52b788"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f4a261"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#e0e6ed" font-size="20" font-weight="bold" letter-spacing="2">nf-CODONyAT</text>
  <text x="480" y="58" text-anchor="middle" fill="#90a4ae" font-size="11" letter-spacing="1">CODON-AWARE AMINO ACID VARIANT TYPING · NEXTFLOW PIPELINE</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TRACK 1 — Input / Validation (top, red line)   -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Track line -->
  <line x1="60" y1="100" x2="880" y2="100" stroke="#e63946" stroke-width="4" opacity="0.3"/>
  <line x1="60" y1="100" x2="880" y2="100" stroke="url(#subwayGrad)" stroke-width="3" stroke-dasharray="none"/>

  <!-- Station: params.samplesheet -->
  <rect x="50" y="82" width="130" height="36" rx="18" fill="#e63946" filter="url(#shadow)"/>
  <text x="115" y="105" text-anchor="middle" fill="white" font-size="10" font-weight="bold">samplesheet.csv</text>

  <!-- Station: VALIDATE_INPUT -->
  <rect x="210" y="82" width="160" height="36" rx="18" fill="#e63946" filter="url(#shadow)"/>
  <text x="290" y="100" text-anchor="middle" fill="white" font-size="10" font-weight="bold">VALIDATE_INPUT</text>
  <text x="290" y="112" text-anchor="middle" fill="#ffcdd2" font-size="8">subworkflow</text>

  <!-- Checks inline -->
  <text x="290" y="140" text-anchor="middle" fill="#90a4ae" font-size="8">✓ cols</text>
  <text x="290" y="150" text-anchor="middle" fill="#90a4ae" font-size="8">✓ SAM exists</text>
  <text x="290" y="160" text-anchor="middle" fill="#90a4ae" font-size="8">✓ 7-col TSV</text>

  <!-- Station: params.reference -->
  <rect x="400" y="82" width="130" height="36" rx="18" fill="#e63946" filter="url(#shadow)" opacity="0.7"/>
  <text x="465" y="100" text-anchor="middle" fill="white" font-size="10" font-weight="bold">reference.fasta</text>
  <text x="465" y="112" text-anchor="middle" fill="#ffcdd2" font-size="8">annotated</text>

  <!-- Station: params.amplicons -->
  <rect x="560" y="82" width="130" height="36" rx="18" fill="#e63946" filter="url(#shadow)" opacity="0.7"/>
  <text x="625" y="100" text-anchor="middle" fill="white" font-size="10" font-weight="bold">amplicons.tsv</text>
  <text x="625" y="112" text-anchor="middle" fill="#ffcdd2" font-size="8">7 columns</text>

  <!-- Track label -->
  <text x="888" y="104" fill="#e63946" font-size="9" font-weight="bold">INPUT</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TRACK 2 — Processing (middle, blue line)       -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Track line -->
  <line x1="60" y1="220" x2="620" y2="220" stroke="#0077b6" stroke-width="4" opacity="0.25"/>
  <line x1="60" y1="220" x2="620" y2="220" stroke="url(#processGrad)" stroke-width="3"/>

  <!-- CODONYAT_RUN — large station, centre of diagram -->
  <rect x="220" y="192" width="200" height="56" rx="8" fill="#0a2540" stroke="#00b4d8" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- glow ring -->
  <rect x="218" y="190" width="204" height="60" rx="10" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.3"/>

  <text x="320" y="215" text-anchor="middle" fill="#00b4d8" font-size="13" font-weight="bold" filter="url(#glow)">CODONYAT_RUN</text>
  <line x1="235" y1="222" x2="405" y2="222" stroke="#0077b6" stroke-width="0.5" opacity="0.5"/>
  <text x="320" y="234" text-anchor="middle" fill="#90a4ae" font-size="9">scatter · per sample</text>
  <text x="320" y="246" text-anchor="middle" fill="#548991" font-size="8">codonyat-runner → .tsv + .xml</text>

  <!-- Track label -->
  <text x="628" y="224" fill="#00b4d8" font-size="9" font-weight="bold">PROCESS</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TRACK 3 — Aggregation (green line)              -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Track line from CODONYAT_RUN down-right to SUMMARY -->
  <polyline points="420,220 420,300 510,300" fill="none" stroke="#52b788" stroke-width="3"/>
  <circle cx="420" cy="220" r="4" fill="#52b788"/>

  <!-- Track line horizontal for summary -->
  <line x1="510" y1="300" x2="700" y2="300" stroke="#52b788" stroke-width="4" opacity="0.25"/>
  <line x1="510" y1="300" x2="700" y2="300" stroke="url(#summaryGrad)" stroke-width="3"/>

  <!-- CODONYAT_SUMMARY station -->
  <rect x="510" y="282" width="180" height="36" rx="18" fill="#2d6a4f" filter="url(#shadow)"/>
  <text x="600" y="299" text-anchor="middle" fill="white" font-size="11" font-weight="bold">CODONYAT_SUMMARY</text>
  <text x="600" y="311" text-anchor="middle" fill="#b7e4c7" font-size="8">codonyat_summary.py · merge TSVs</text>

  <!-- Track label -->
  <text x="708" y="304" fill="#52b788" font-size="9" font-weight="bold">AGGREGATE</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TRACK 4 — Output (bottom, orange line)         -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Track line -->
  <line x1="60" y1="380" x2="700" y2="380" stroke="#f4a261" stroke-width="4" opacity="0.25"/>
  <line x1="60" y1="380" x2="700" y2="380" stroke="#f4a261" stroke-width="3"/>

  <!-- Output station: codonyat_summary.tsv -->
  <rect x="80" y="362" width="180" height="36" rx="18" fill="#9b2226" filter="url(#shadow)"/>
  <text x="170" y="379" text-anchor="middle" fill="white" font-size="10" font-weight="bold">codonyat_summary.tsv</text>
  <text x="170" y="391" text-anchor="middle" fill="#ffccbc" font-size="8">all samples · +SAMPLE col</text>

  <!-- Output station: per-sample results -->
  <rect x="300" y="362" width="200" height="36" rx="18" fill="#ae2012" filter="url(#shadow)"/>
  <text x="400" y="379" text-anchor="middle" fill="white" font-size="10" font-weight="bold">results/samples/{id}/</text>
  <text x="400" y="391" text-anchor="middle" fill="#ffccbc" font-size="8">{sample}.tsv + {sample}.xml</text>

  <!-- Track label -->
  <text x="708" y="384" fill="#f4a261" font-size="9" font-weight="bold">OUTPUT</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Connection arrows from summary to outputs       -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Vertical drop from summary to output track -->
  <polyline points="600,318 600,362" fill="none" stroke="#52b788" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="170" y1="318" x2="170" y2="362" fill="none" stroke="#52b788" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="400" y1="318" x2="400" y2="362" fill="none" stroke="#52b788" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Flow labels                                     -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Arrows / flow annotations -->
  <text x="175" y="78" text-anchor="middle" fill="#e63946" font-size="8" font-style="italic">params</text>
  <text x="340" y="78" text-anchor="middle" fill="#e63946" font-size="8" font-style="italic">validate</text>

  <!-- Scatter annotation -->
  <text x="320" y="175" text-anchor="middle" fill="#00b4d8" font-size="9" font-style="italic">scatter</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Legend box                                      -->
  <!-- ═══════════════════════════════════════════════ -->

  <rect x="720" y="82" width="220" height="160" rx="8" fill="#0a1628" stroke="#1e3a5f" stroke-width="1"/>

  <text x="740" y="103" fill="#90a4ae" font-size="11" font-weight="bold">LEGEND</text>
  <line x1="740" y1="110" x2="930" y2="110" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Red line -->
  <line x1="740" y1="125" x2="800" y2="125" stroke="#e63946" stroke-width="3"/>
  <rect x="800" y="115" width="130" height="20" rx="10" fill="#e63946" opacity="0.9"/>
  <text x="865" y="128" text-anchor="middle" fill="white" font-size="9">Input / Validate</text>

  <!-- Blue line -->
  <line x1="740" y1="155" x2="800" y2="155" stroke="#00b4d8" stroke-width="3"/>
  <rect x="800" y="145" width="130" height="20" rx="10" fill="#0077b6" opacity="0.9"/>
  <text x="865" y="158" text-anchor="middle" fill="white" font-size="9">Process (scatter)</text>

  <!-- Green line -->
  <line x1="740" y1="185" x2="800" y2="185" stroke="#52b788" stroke-width="3"/>
  <rect x="800" y="175" width="130" height="20" rx="10" fill="#2d6a4f" opacity="0.9"/>
  <text x="865" y="188" text-anchor="middle" fill="white" font-size="9">Aggregate</text>

  <!-- Orange line -->
  <line x1="740" y1="215" x2="800" y2="215" stroke="#f4a261" stroke-width="3"/>
  <rect x="800" y="205" width="130" height="20" rx="10" fill="#ae2012" opacity="0.9"/>
  <text x="865" y="218" text-anchor="middle" fill="white" font-size="9">Output</text>

  <!-- Station dot -->
  <circle cx="760" cy="235" r="6" fill="#00b4d8" stroke="#0a2540" stroke-width="2"/>
  <text x="775" y="239" fill="#90a4ae" font-size="9">Process station</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Footer                                          -->
  <!-- ═══════════════════════════════════════════════ -->

  <line x1="40" y1="410" x2="920" y2="410" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="40" y="402" fill="#548991" font-size="9">nf-codonyat v0.1.0</text>
  <text x="480" y="402" text-anchor="middle" fill="#1e3a5f" font-size="9">https://github.com/sjoclaudi/nf-codonyat</text>
  <text x="920" y="402" text-anchor="end" fill="#548991" font-size="9">MIT License</text>

  <!-- Version badge -->
  <rect x="880" y="20" width="65" height="20" rx="10" fill="#0077b6" opacity="0.8"/>
  <text x="912" y="34" text-anchor="middle" fill="white" font-size="9" font-weight="bold">v0.1.0</text>
</svg>