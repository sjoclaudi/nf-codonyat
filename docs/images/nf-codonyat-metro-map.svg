<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .station { fill: #2c3e50; stroke: #ecf0f1; stroke-width: 3; }
      .label { fill: #2c3e50; font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .section-label { fill: #7f8c8d; font-family: Arial, sans-serif; font-size: 11px; font-style: italic; }
      .line { stroke-width: 6; fill: none; stroke-linecap: round; }
      .line-main { stroke: #3498db; }
      .line-branch { stroke: #e67e22; }
      .line-report { stroke: #9b59b6; }
      .terminus { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 4; }
      .terminus-label { fill: #2c3e50; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .title { fill: #2c3e50; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #7f8c8d; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#ecf0f1"/>
  
  <!-- Title -->
  <text x="600" y="35" class="title">nf-codonyat Pipeline</text>
  <text x="600" y="55" class="subtitle">HIV-1 Amplicon Analysis (Research Use Only)</text>
  
  <!-- Section: Input -->
  <text x="70" y="95" class="section-label">INPUT</text>
  <circle cx="100" cy="120" r="20" class="terminus"/>
  <text x="100" y="125" class="terminus-label">IN</text>
  
  <!-- Section: Pre-processing -->
  <text x="170" y="95" class="section-label">PRE-PROCESSING</text>
  
  <!-- FastQC -->
  <line x1="120" y1="120" x2="180" y2="120" class="line line-main"/>
  <circle cx="200" cy="120" r="18" class="station"/>
  <text x="215" y="115" class="label">FastQC</text>
  
  <!-- fastp -->
  <line x1="218" y1="120" x2="280" y2="120" class="line line-main"/>
  <circle cx="300" cy="120" r="18" class="station"/>
  <text x="315" y="115" class="label">fastp</text>
  <text x="315" y="130" class="section-label">(trim)</text>
  
  <!-- Section: QC / Contamination -->
  <text x="370" y="95" class="section-label">QC / SUBTYPING</text>
  
  <!-- Kraken2 branch -->
  <line x1="318" y1="120" x2="380" y2="120" class="line line-main"/>
  <line x1="400" y1="120" x2="400" y2="170" class="line line-report"/>
  <circle cx="400" cy="190" r="18" class="station"/>
  <text x="415" y="195" class="label">Kraken2</text>
  
  <!-- BBSplit branch -->
  <line x1="400" y1="120" x2="400" y2="220" class="line line-report"/>
  <circle cx="400" cy="240" r="18" class="station"/>
  <text x="415" y="245" class="label">BBSplit</text>
  
  <!-- BBMerge (PE only) -->
  <line x1="400" y1="120" x2="480" y2="120" class="line line-main"/>
  <circle cx="500" cy="120" r="18" class="station"/>
  <text x="515" y="115" class="label">BBMerge</text>
  <text x="515" y="130" class="section-label">(PE)</text>
  
  <!-- Section: Alignment -->
  <text x="590" y="95" class="section-label">ALIGNMENT</text>
  
  <!-- Bowtie2 Build -->
  <line x1="518" y1="120" x2="600" y2="120" class="line line-main"/>
  <circle cx="620" cy="120" r="18" class="station"/>
  <text x="635" y="115" class="label">Bowtie2</text>
  <text x="635" y="130" class="section-label">Build</text>
  
  <!-- Bowtie2 Align -->
  <line x1="638" y1="120" x2="700" y2="120" class="line line-main"/>
  <circle cx="720" cy="120" r="18" class="station"/>
  <text x="735" y="115" class="label">Bowtie2</text>
  <text x="735" y="130" class="section-label">Align</text>
  
  <!-- Strand branch (PE unmerged) -->
  <line x1="720" y1="138" x2="720" y2="280" class="line line-branch"/>
  <circle cx="720" cy="300" r="18" class="station"/>
  <text x="650" y="305" class="label">Strand (PE)</text>
  
  <!-- samtools merge -->
  <line x1="738" y1="120" x2="800" y2="120" class="line line-main"/>
  <circle cx="820" cy="120" r="18" class="station"/>
  <text x="835" y="125" class="label">Merge</text>
  
  <!-- SAM input joins here -->
  <line x1="100" y1="140" x2="100" y2="400" class="line line-main" stroke-dasharray="5,5"/>
  <line x1="100" y1="400" x2="820" y2="400" class="line line-main" stroke-dasharray="5,5"/>
  <line x1="820" y1="138" x2="820" y2="400" class="line line-main"/>
  <text x="200" y="420" class="section-label">SAM direct (skip FASTQ steps)</text>
  
  <!-- Section: Filtering -->
  <text x="900" y="95" class="section-label">FILTERING</text>
  
  <!-- Flagstat pre -->
  <line x1="838" y1="120" x2="900" y2="120" class="line line-main"/>
  <circle cx="920" cy="120" r="18" class="station"/>
  <text x="870" y="115" class="label">flagstat</text>
  
  <!-- Filter (samtools view) -->
  <line x1="938" y1="120" x2="1000" y2="120" class="line line-main"/>
  <circle cx="1020" cy="120" r="18" class="station"/>
  <text x="1035" y="115" class="label">Filter</text>
  <text x="1035" y="130" class="section-label">MAPQ≥20</text>
  
  <!-- Flagstat post -->
  <line x1="1038" y1="120" x2="1080" y2="120" class="line line-main"/>
  <circle cx="1100" cy="120" r="18" class="station"/>
  <text x="1050" y="145" class="label">flagstat</text>
  
  <!-- Sort -->
  <line x1="1100" y1="138" x2="1100" y2="200" class="line line-main"/>
  <circle cx="1100" cy="220" r="18" class="station"/>
  <text x="1050" y="225" class="label">Sort</text>
  
  <!-- Section: Analysis -->
  <text x="600" y="455" class="section-label">ANALYSIS</text>
  
  <!-- Split to codonyat and iVar -->
  <line x1="1100" y1="238" x2="1100" y2="480" class="line line-main"/>
  
  <!-- codonyat branch -->
  <line x1="1100" y1="480" x2="950" y2="480" class="line line-main"/>
  <circle cx="930" cy="480" r="18" class="station"/>
  <text x="840" y="485" class="label">codonyat</text>
  
  <!-- AA table -->
  <line x1="930" y1="498" x2="930" y2="560" class="line line-main"/>
  <circle cx="930" cy="580" r="18" class="station"/>
  <text x="825" y="585" class="label">AA Tables</text>
  
  <!-- iVar consensus branch -->
  <line x1="1100" y1="480" x2="1100" y2="540" class="line line-main"/>
  <circle cx="1100" cy="560" r="18" class="station"/>
  <text x="1020" y="565" class="label">iVar</text>
  
  <!-- Consensus report -->
  <line x1="1100" y1="578" x2="1100" y2="620" class="line line-main"/>
  <circle cx="1100" cy="640" r="18" class="station"/>
  <text x="995" y="645" class="label">Consensus</text>
  
  <!-- Section: Reporting -->
  <text x="600" y="695" class="section-label">REPORTING</text>
  
  <!-- Join to reporting -->
  <line x1="930" y1="598" x2="930" y2="720" class="line line-main"/>
  <line x1="1100" y1="658" x2="1100" y2="720" class="line line-main"/>
  <line x1="930" y1="720" x2="1015" y2="720" class="line line-main"/>
  
  <!-- Join report branches -->
  <line x1="400" y1="208" x2="630" y2="720" class="line line-report"/>
  <line x1="400" y1="258" x2="650" y2="720" class="line line-report"/>
  <line x1="720" y1="318" x2="670" y2="720" class="line line-branch"/>
  
  <!-- MultiQC / Provenance / Summaries -->
  <circle cx="1015" cy="720" r="18" class="station"/>
  <text x="925" y="715" class="label">Summary</text>
  <text x="915" y="730" class="section-label">MultiQC + Provenance</text>
  
  <!-- Output -->
  <line x1="1015" y1="738" x2="1015" y2="760" class="line line-main"/>
  <circle cx="1015" cy="780" r="20" class="terminus"/>
  <text x="1015" y="670" class="terminus-label">OUT</text>
  
  <!-- Footer -->
  <text x="600" y="770" class="subtitle">sjoclaudi/nf-codonyat • Research use only • No clinical interpretation</text>
</svg>
