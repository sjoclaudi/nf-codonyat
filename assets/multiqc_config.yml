report_comment: >
    This report has been generated by the <a href="https://github.com/sjoclaudi/nf-codonyat" target="_blank">nf-codonyat</a>
    analysis pipeline. For information about how to interpret these results, please see the
    <a href="https://github.com/sjoclaudi/nf-codonyat/blob/main/docs/output.md" target="_blank">output documentation</a>.
    <br><br>
    <strong>Research use only.</strong> This pipeline provides descriptive outputs (QC, contamination report,
    subtype estimate, consensus, codon and amino-acid frequency tables) without drug-resistance or clinical interpretation.

report_section_order:
    "sjoclaudi-nf-codonyat-methods-description":
        order: -1000
    software_versions:
        order: -1001
    "sjoclaudi-nf-codonyat-summary":
        order: -1002

export_plots: true

fn_ignore_files:
    - '.nextflow*'
    - '*.run'
    - 'work/*'
    - 'bin/*'

custom_logo: 'nf-codonyat_logo.png'
custom_logo_url: 'https://github.com/sjoclaudi/nf-codonyat'
custom_logo_title: 'nf-codonyat'

module_order:
    - fastqc
    - fastp
    - kraken
    - bbmap
    - bowtie2
    - samtools
    
sp:
    fastp:
        fn: '*.fastp.json'
    kraken:
        fn: '*.kraken2.report.txt'
