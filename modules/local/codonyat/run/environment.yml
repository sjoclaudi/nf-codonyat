# Software environment for the local Python modules (codonyat and helper scripts).
# Keep in sync with the Dockerfile (same versions).
name: codonyat
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12
  - conda-forge::biopython=1.85
  - conda-forge::pip
  - pip:
      - "codonyat==1.1.0"
