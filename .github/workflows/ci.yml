name: nf-codonyat CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: "26.04.6"
  NFT_VER: "0.9.5"
  NXF_ANSI_LOG: false
  IMAGE: ghcr.io/sjoclaudi/nf-codonyat:0.7.0-dev  # keep in sync with the modules' container directive

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: "21"

      - name: nextflow lint
        run: nextflow lint .

      - name: prepare_inputs stub tests
        run: python3 tests/test_prepare_inputs.py

      - name: contamination_summary stub tests
        run: python3 tests/test_contamination_summary.py

      - name: infra.json matches config and hides URIs
        run: python3 tests/test_infra_json.py

      - name: default research flags leave TSV/XML byte-identical
        run: |
          python3 -m pip install --user 'codonyat==1.3.1'
          python3 tests/test_codonyat_research_flags.py

  test:
    name: test (${{ matrix.profile }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [docker, conda]
    defaults:
      run:
        shell: bash -el {0}   # login shell so conda is on PATH
    steps:
      - uses: actions/checkout@v7

      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: "21"

      - uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}

      # docker: build the task image locally under the same tag the pipeline uses
      - name: Build task image
        if: matrix.profile == 'docker'
        run: docker build -t "$IMAGE" .

      - name: Set up conda (miniforge)
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          conda-remove-defaults: "true"
          auto-activate: true
          activate-environment: base

      - name: nf-test
        run: nf-test test --ci --profile ${{ matrix.profile }} --verbose

      - name: Run test profile
        run: nextflow run . -profile test,${{ matrix.profile }} --outdir results-test

      - name: Check summary has rows for the SAM and FASTQ samples
        run: |
          head -3 results-test/codonyat_summary.tsv
          n=$(tail -n +2 results-test/codonyat_summary.tsv | cut -f1 | sort -u | tr '\n' ' ')
          echo "samples in summary: $n"
          [ "$n" = "HVG286PL sample1 sample2 " ]

      - name: Check FASTQ-path outputs and MultiQC report
        run: |
          ls -l results-test/fastqc/HVG286PL_1_fastqc.html results-test/fastp/HVG286PL.fastp.json \
                results-test/alignment/HVG286PL.bam results-test/alignment/HVG286PL.{merged,unmerged}.bowtie2.log \
                results-test/merge/HVG286PL_ihist.txt results-test/multiqc/multiqc_report.html
          grep 'overall alignment rate' results-test/alignment/HVG286PL.merged.bowtie2.log
          grep 'Joined' results-test/merge/HVG286PL.bbmerge.log

      - name: Check report, consensus, amino-acid and provenance outputs
        run: |
          cat results-test/contamination/contamination_summary.tsv
          cat results-test/subtype/subtype_summary.tsv
          cat results-test/consensus/consensus_stats.tsv
          grep -c '^>' results-test/consensus/consensus_all.fa | grep -qx 3
          awk -F'\t' 'NR>1 && $1=="HVG286PL" {print $7}' results-test/subtype/subtype_summary.tsv | sort -u | grep -qx B
          head -3 results-test/variants/aa_variants_summary.tsv
          head -3 results-test/strand/HVG286PL.strand_metrics_unmerged.tsv
          grep -q 'Research use only' results-test/pipeline_info/methods.md
          cat results-test/pipeline_info/software_versions.yml

      - name: Check v0.5.0 reference/ and run_mode.json
        run: |
          python3 - <<'PY'
          import json
          v = json.load(open("results-test/reference/validation.json"))
          assert v["valid"] is True
          m = json.load(open("results-test/pipeline_info/run_mode.json"))
          assert isinstance(m["reference_accessions"], list)
          assert m["reference_accessions"] == ["K03455|HIVHXB2CG"]
          assert m["preset"] == "hiv1"
          PY
          grep -q TARGET_TAXID results-test/contamination/contamination_summary.tsv
          awk -F'\t' 'NR==1 {for (i=1;i<=NF;i++) h[$i]=i} NR==2 {print $h["TARGET_TAXID"]}' \
            results-test/contamination/contamination_summary.tsv | grep -qx 11676

      - name: Check execution reports are in the outdir
        run: ls -l results-test/pipeline_info/{execution_report.html,execution_timeline.html,execution_trace.txt,pipeline_dag.html}

      - name: Run SARS-CoV-2 custom-mode test profile
        run: nextflow run . -profile test_sarscov2,${{ matrix.profile }} --outdir results-test-sarscov2

      - name: Check SARS-CoV-2 outputs
        run: |
          python3 - <<'PY'
          import csv, json
          v = json.load(open("results-test-sarscov2/reference/validation.json"))
          assert v["valid"] is True
          assert v["errors"] == []
          m = json.load(open("results-test-sarscov2/pipeline_info/run_mode.json"))
          assert m["preset"] == "custom"
          assert m["reference_accessions"] == ["MN908947.3"]
          with open("results-test-sarscov2/variants/aa_variants_summary.tsv") as fh:
              aa = list(csv.DictReader(fh, delimiter="\t"))
          assert len(aa) == 401, len(aa)
          s614g = next(r for r in aa if r["PROTEIN"] == "S" and r["AA_POSITION"] == "614" and r["AA"] == "G")
          assert s614g["REF_AA"] == "D"
          assert float(s614g["FREQ"]) == 70.0
          with open("results-test-sarscov2/consensus/consensus_stats.tsv") as fh:
              cons = list(csv.DictReader(fh, delimiter="\t"))
          assert cons[0]["CONSENSUS_LENGTH"] == "29903"
          PY
          test $(tail -n +2 results-test-sarscov2/reference/amplicons_used.tsv | wc -l) -eq 99
          test -f results-test-sarscov2/samples/SARS2_SIM/SARS2_SIM.tsv
          test ! -d results-test-sarscov2/contamination

      - name: Run influenza A custom-mode test profile
        run: nextflow run . -profile test_flua,${{ matrix.profile }} --outdir results-test-flua

      - name: Check influenza A outputs
        run: |
          python3 - <<'PY'
          import csv, json
          v = json.load(open("results-test-flua/reference/validation.json"))
          assert v["valid"] is True
          assert v["errors"] == []
          m = json.load(open("results-test-flua/pipeline_info/run_mode.json"))
          assert m["preset"] == "custom"
          assert m["reference_accessions"] == ["NC_002017.1", "NC_002018.1"]
          with open("results-test-flua/variants/aa_variants_summary.tsv") as fh:
              aa = list(csv.DictReader(fh, delimiter="\t"))
          assert len(aa) == 257, len(aa)
          ha5v = next(r for r in aa if r["PROTEIN"] == "HA" and r["AA_POSITION"] == "5" and r["AA"] == "V")
          assert ha5v["REF_AA"] == "L" and float(ha5v["FREQ"]) == 25.0
          na3a = next(r for r in aa if r["PROTEIN"] == "NA" and r["AA_POSITION"] == "3" and r["AA"] == "A")
          assert na3a["REF_AA"] == "P" and float(na3a["FREQ"]) == 60.0
          with open("results-test-flua/consensus/consensus_stats.tsv") as fh:
              cons = {r["RECORD"]: r for r in csv.DictReader(fh, delimiter="\t")}
          assert cons["NC_002017.1"]["CONSENSUS_LENGTH"] == "1778"
          assert cons["NC_002018.1"]["CONSENSUS_LENGTH"] == "1413"
          PY
          test -f results-test-flua/samples/FLU_SIM/FLU_SIM.tsv
          test ! -d results-test-flua/contamination

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.profile }}
          path: |
            results-test/
            results-test-sarscov2/
            results-test-flua/
            .nf-test/tests/*/meta/
            .nextflow.log
          if-no-files-found: ignore

  # Publish the task image so users can `-profile docker` without building it.
  # Runs only on pushes to main / version tags, never on pull requests.
  publish-image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
